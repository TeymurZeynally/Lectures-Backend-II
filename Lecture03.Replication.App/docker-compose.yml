services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd0
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
    ports:
      - "2379:2379"

  pg1:
    image: ghcr.io/zalando/spilo-16:3.3-p3
    hostname: pg1
    depends_on:
      - etcd
    environment:
      PATRONI_NAME: pg1
      SCOPE: lecture03-cluster
      ETCD3_HOST: etcd:2379
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: postgres
      PGUSER_STANDBY: replicator
      PGPASSWORD_STANDBY: replicator
      # SPILO_CONFIGURATION: '{"postgresql":{"parameters":{"synchronous_commit":"on","synchronous_standby_names":"ANY 2 (pg1,pg2,pg3)"}},"bootstrap":{"dcs":{"synchronous_mode":false}}}'
      SPILO_CONFIGURATION: '{"bootstrap": {"dcs": {"synchronous_mode": false}}}'
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:8008:8008"
    volumes:
      - pg1-data:/home/postgres/pgroot

  pg2:
    image: ghcr.io/zalando/spilo-16:3.3-p3
    hostname: pg2
    depends_on:
      - etcd
    environment:
      PATRONI_NAME: pg2
      SCOPE: lecture03-cluster
      ETCD3_HOST: etcd:2379
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: postgres
      PGUSER_STANDBY: replicator
      PGPASSWORD_STANDBY: replicator
      # SPILO_CONFIGURATION: '{"postgresql":{"parameters":{"synchronous_commit":"on","synchronous_standby_names":"ANY 2 (pg1,pg2,pg3)"}},"bootstrap":{"dcs":{"synchronous_mode":false}}}'
      SPILO_CONFIGURATION: '{"bootstrap": {"dcs": {"synchronous_mode": false}}}'
    ports:
      - "127.0.0.2:5432:5432"
      - "127.0.0.2:8008:8008"
    volumes:
      - pg2-data:/home/postgres/pgroot

  pg3:
    image: ghcr.io/zalando/spilo-16:3.3-p3
    hostname: pg3
    depends_on:
      - etcd
    environment:
      PATRONI_NAME: pg3
      SCOPE: lecture03-cluster
      ETCD3_HOST: etcd:2379
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: postgres
      PGUSER_STANDBY: replicator
      PGPASSWORD_STANDBY: replicator
      # SPILO_CONFIGURATION: '{"postgresql":{"parameters":{"synchronous_commit":"on","synchronous_standby_names":"ANY 2 (pg1,pg2,pg3)"}},"bootstrap":{"dcs":{"synchronous_mode":false}}}'
      SPILO_CONFIGURATION: '{"bootstrap": {"dcs": {"synchronous_mode": false}}}'
    ports:
      - "127.0.0.3:5432:5432"
      - "127.0.0.3:8008:8008"
    volumes:
      - pg3-data:/home/postgres/pgroot

  ivory:
    image: veegres/ivory:latest
    depends_on:
      - pg1
      - pg2
      - pg3
    ports:
      - "8080:80"
    volumes:
      - ivory-data:/opt/ivory/data

volumes:
  pg1-data:
  pg2-data:
  pg3-data:
  ivory-data:
