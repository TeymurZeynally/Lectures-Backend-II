# HTTP API Tempo: через него Grafana ищет трейсы (TraceQL) и получает трейс по TraceId
server:
  http_listen_port: 3200

# Приём трейсов: Collector отправляет спаны сюда по OTLP/gRPC
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Хранение трейсов
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal   
    local:
      path: /var/tempo/blocks

# Метрики из трейсов: Tempo считает их по входящим спанам и отправляет в Prometheus
metrics_generator:
  registry:
    collection_interval: 1s
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Какие метрики считать: граф вызовов (traces_service_graph_*) и метрики по спанам (traces_spanmetrics_*)
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

# Не отправлять анонимную статистику использования в Grafana Labs
usage_report:
  reporting_enabled: false
