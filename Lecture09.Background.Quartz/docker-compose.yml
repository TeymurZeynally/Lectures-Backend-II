services:
  postgres:
    image: postgres:16
    container_name: lecture09-quartz-postgres
    environment:
      POSTGRES_DB: quartz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - quartz-data:/var/lib/postgresql/data

volumes:
  quartz-data:
