<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обработка видео</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-slate-800">Обработка видео</h1>
            <a href="/hangfire" target="_blank" class="px-4 py-2 rounded-lg bg-slate-800 text-white text-sm hover:bg-slate-700">Hangfire Dashboard</a>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 mb-6">
            <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">В очереди</div><div data-stat="enqueued" class="text-2xl font-semibold text-slate-800">–</div></div>
            <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Отложены</div><div data-stat="scheduled" class="text-2xl font-semibold text-slate-800">–</div></div>
            <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Ждут родителя</div><div data-stat="awaiting" class="text-2xl font-semibold text-slate-800">–</div></div>
            <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Выполняются</div><div data-stat="processing" class="text-2xl font-semibold text-indigo-600">–</div></div>
            <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Готово</div><div data-stat="succeeded" class="text-2xl font-semibold text-emerald-600">–</div></div>
            <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Ошибки</div><div data-stat="failed" class="text-2xl font-semibold text-red-600">–</div></div>
            <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Worker'ов</div><div data-stat="servers" class="text-2xl font-semibold text-slate-800">–</div></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow p-5 md:col-span-2">
                <h2 class="text-xl font-semibold text-slate-800 mb-1">Загрузка ролика</h2>
                <p class="text-sm text-slate-500 mb-4">Проверка → 1080p → 720p → 480p → публикация, удаление исходника через минуту</p>
                <div class="flex gap-2">
                    <input id="title" placeholder="Название (пусто - случайное)" class="flex-1 px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-indigo-500">
                    <button id="upload" class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Загрузить</button>
                    <button id="upload-batch" class="px-4 py-2 rounded-lg bg-indigo-100 text-indigo-700 hover:bg-indigo-200">Загрузить 10</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow p-5">
                <h2 class="text-xl font-semibold text-slate-800 mb-1">Статистика просмотров</h2>
                <p class="text-sm text-slate-500 mb-4">Периодическая задача, каждые 10 секунд</p>
                <button id="recalculate" class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">Пересчитать сейчас</button>
            </div>
        </div>

        <h2 class="text-xl font-semibold text-slate-800 mb-3">Загруженные ролики</h2>
        <div id="videos" class="space-y-3"></div>
    </div>

    <template id="video-template">
        <div class="bg-white rounded-xl shadow p-4">
            <div class="flex justify-between items-baseline mb-2">
                <span data-title class="font-semibold text-slate-800"></span>
                <span data-id class="text-xs text-slate-400 font-mono"></span>
            </div>
            <div data-jobs class="flex flex-wrap gap-2"></div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
