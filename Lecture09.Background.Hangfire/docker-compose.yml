services:
  postgres:
    image: postgres:16
    container_name: lecture09-hangfire-postgres
    environment:
      POSTGRES_DB: hangfire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hangfire-data:/var/lib/postgresql/data

volumes:
  hangfire-data:
