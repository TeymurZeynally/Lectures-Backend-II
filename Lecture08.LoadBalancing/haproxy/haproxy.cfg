#   http://localhost:8080 (static)
#   http://localhost:8081 (dynamic)

global
    maxconn 20000

defaults
    # L7: HAProxy parses every HTTP request and balances requests.
    # Switch to "mode tcp" for L4: it balances TCP connections and does not look inside them
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s

# Stats page: http://localhost:8404
listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 1s
    stats admin if TRUE

frontend static-in
    bind *:8080
    default_backend cats-static

frontend dynamic-in
    bind *:8081
    default_backend cats-dynamic

backend cats-static
    # Static algorithms (they do not know anything about the state of the instances):
    #   balance roundrobin - one by one: cats-1, cats-2, cats-3, cats-1, ...
    #   balance random     - a random instance for every request
    #   balance source     - hash of the client IP: the load generator has one IP, so everything goes to one instance
    # Weighted round robin: add "weight N" to the server lines, e.g. "weight 3" gets 3 times more requests than "weight 1"
    balance roundrobin

    # L4 health check: "check" without "option httpchk" - HAProxy just opens a TCP connection every second.
    # A killed instance is excluded, but a broken one that still accepts connections passes the check.
    # Remove "check" from the server lines to turn health checks off
    default-server inter 1s fall 2 rise 2

    server cats-1 127.0.0.1:5101 check
    server cats-2 127.0.0.1:5102 check
    server cats-3 127.0.0.1:5103 check

backend cats-dynamic
    # Dynamic algorithms (they look at the current state of the instances):
    #   balance leastconn  - the instance with the fewest active connections
    #   balance random(2)  - power of two choices: take two random instances, use the less loaded one
    balance leastconn

    # L7 health check: HAProxy calls GET /health every second and expects 2xx/3xx.
    # 2 failures in a row - the instance is out, 2 successes - it is back.
    # Remove "check" from the server lines to turn health checks off
    option httpchk GET /health
    default-server inter 1s fall 2 rise 2

    # Passive health check (outlier detection): watch real responses, 10 errors in a row mark the instance down.
    # To see it alone comment out "option httpchk" (the active check becomes a plain TCP connect,
    # which a broken but running instance passes) and uncomment the line below
    # default-server inter 1s fall 2 rise 2 observe layer7 error-limit 10 on-error mark-down

    # Resend a request that could not reach an instance to another one instead of returning 503
    # retries 1
    # option redispatch

    server cats-1 127.0.0.1:5101 check
    server cats-2 127.0.0.1:5102 check
    server cats-3 127.0.0.1:5103 check
