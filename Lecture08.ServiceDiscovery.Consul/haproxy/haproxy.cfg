global
    maxconn 20000

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 1s
    stats admin if TRUE

resolvers consul
    nameserver consul 127.0.0.1:8600
    accepted_payload_size 8192
    hold valid 1s

frontend http-in
    bind *:8080
    default_backend cats

backend cats
    balance leastconn

    # There is no list of instances here: HAProxy creates 10 server slots and fills them from the SRV record
    # _cats._tcp.service.consul. Consul returns only instances that pass their health check.
    # allow-dup-ip: all instances are on 127.0.0.1 and differ only by port
    server-template cats 10 _cats._tcp.service.consul resolvers consul resolve-opts allow-dup-ip resolve-prefer ipv4 init-addr none
