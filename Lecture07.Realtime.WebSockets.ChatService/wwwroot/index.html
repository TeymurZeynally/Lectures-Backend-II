<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глобальный чат</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 h-screen p-8">
    <div class="max-w-2xl h-full mx-auto flex flex-col bg-white rounded-xl shadow">
        <div class="flex items-center justify-between p-4 border-b">
            <h1 class="text-2xl font-bold text-slate-800">Глобальный чат</h1>
            <span id="nickname" class="text-slate-500">подключение...</span>
        </div>

        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <form id="form" class="flex gap-2 p-4 border-t">
            <input id="text" maxlength="500" autocomplete="off" placeholder="Сообщение..."
                   class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Отправить</button>
        </form>
    </div>

    <template id="message-template">
        <div class="flex flex-col">
            <div class="text-xs text-slate-400 mb-1"><span data-author class="font-semibold"></span> · <span data-time></span></div>
            <div data-text class="px-3 py-2 rounded-lg max-w-[80%] break-words"></div>
        </div>
    </template>

    <script type="module" src="app.js"></script>
</body>
</html>
